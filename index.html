<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能简历匹配展示页生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">简历匹配生成器</div>
      <span class="status-text status-idle" id="statusText">等待操作</span>
    </div>
  </nav>

  <!-- 主内容区：左右分栏 -->
  <main class="main-content app-layout">

    <!-- 左侧：输入面板 -->
    <section class="app-panel app-input">

      <!-- 上传区 -->
      <div class="panel-block" id="dropZone">
        <div class="drop-zone">
          <div class="drop-icon">&#8682;</div>
          <p class="drop-title">拖拽简历文件到此处</p>
          <p class="drop-hint">支持 PDF / DOCX，或点击选择文件</p>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
      </div>

      <!-- 默认简历按钮 -->
      <div class="panel-block">
        <button class="btn btn-outline" id="useDefaultBtn">使用默认简历（吴友虎）</button>
        <div class="resume-badge" id="resumeBadge"></div>
      </div>

      <!-- JD 输入 -->
      <div class="panel-block">
        <label class="block-label" for="jdTextarea">岗位 JD 描述</label>
        <textarea
          id="jdTextarea"
          class="jd-textarea"
          placeholder="在此粘贴岗位 JD 描述…&#10;&#10;Ctrl + Enter 快捷生成"
          rows="10"
        ></textarea>
      </div>

      <!-- 操作按钮 -->
      <div class="panel-block">
        <button class="btn btn-primary" id="generateBtn">生成匹配页</button>
        <span class="btn-hint">Ctrl + Enter</span>
      </div>

      <!-- 错误提示 -->
      <div class="error-container" id="errorContainer"></div>

    </section>

    <!-- 右侧：预览面板 -->
    <section class="app-panel app-preview">

      <!-- 匹配报告 -->
      <div class="match-report" id="matchReport" style="display:none"></div>

      <!-- 预览 iframe -->
      <div class="preview-wrapper" id="previewWrapper">
        <div class="preview-placeholder" id="previewPlaceholder">
          <div class="placeholder-icon">&#8984;</div>
          <p>上传简历 + 填写 JD → 点击生成</p>
          <p>匹配结果将在此实时预览</p>
        </div>
        <iframe
          id="previewFrame"
          class="preview-frame"
          sandbox="allow-scripts allow-same-origin"
          title="生成页面预览"
          style="display:none"
        ></iframe>
      </div>

      <!-- 下载按钮 -->
      <div class="panel-block" style="text-align:center">
        <button class="btn btn-download" id="downloadBtn" style="display:none">下载 HTML 文件</button>
      </div>

    </section>

  </main>

  <!-- CDN 依赖：pdf.js + mammoth.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- 主控逻辑 -->
  <script type="module" src="app.js"></script>

</body>
</html>
