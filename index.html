<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能简历匹配展示页生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">简历匹配生成器</div>
      <span class="status-text status-idle" id="statusText">等待操作</span>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="main-content app-layout">

    <!-- 左侧：输入面板 -->
    <section class="app-panel app-input">

      <!-- 上传区 -->
      <div class="panel-block" id="dropZone">
        <div class="drop-zone">
          <div class="drop-icon">&#8682;</div>
          <p class="drop-title">拖拽简历文件到此处</p>
          <p class="drop-hint">支持 PDF / DOCX，或点击选择文件</p>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
      </div>

      <!-- 默认简历按钮 -->
      <div class="panel-block">
        <button class="btn btn-outline" id="useDefaultBtn">使用默认简历（吴友虎）</button>
        <div class="resume-badge" id="resumeBadge"></div>
      </div>

      <!-- JD 输入 -->
      <div class="panel-block">
        <label class="block-label" for="jdTextarea">岗位 JD 描述</label>
        <textarea
          id="jdTextarea"
          class="jd-textarea"
          placeholder="在此粘贴岗位 JD 描述…&#10;&#10;Ctrl + Enter 快捷生成"
          rows="10"
        ></textarea>
      </div>

      <!-- 操作按钮 -->
      <div class="panel-block">
        <button class="btn btn-primary" id="generateBtn">生成匹配页</button>
        <span class="btn-hint">Ctrl + Enter</span>
      </div>

      <!-- 错误提示 -->
      <div class="error-container" id="errorContainer"></div>

    </section>

    <!-- 右侧：结果面板 -->
    <section class="app-panel app-result" id="resultPanel">

      <!-- 占位提示 -->
      <div class="result-placeholder" id="resultPlaceholder">
        <div class="placeholder-icon">&#8984;</div>
        <p>上传简历 + 填写 JD → 点击生成</p>
        <p>匹配结果将在此展示</p>
      </div>

      <!-- 加载动画 -->
      <div class="loading-spinner" id="loadingSpinner" style="display:none">
        <div class="spinner"></div>
        <p>AI 正在分析匹配…</p>
      </div>

      <!-- 结果容器 -->
      <div class="result-container" id="resultContainer" style="display:none">

        <!-- 复制按钮 -->
        <div class="result-toolbar">
          <button class="btn btn-copy" id="copyFullBtn">复制完整内容</button>
        </div>

        <!-- Hero 区域 -->
        <section class="profile-hero" id="profileHero"></section>

        <!-- 匹配摘要 -->
        <section class="profile-summary" id="profileSummary"></section>

        <!-- 四维度匹配卡片 -->
        <section class="profile-dimensions" id="profileDimensions"></section>

        <!-- 岗位定制版经历展示 -->
        <section class="profile-experiences" id="profileExperiences"></section>

        <!-- 页脚 -->
        <section class="profile-footer" id="profileFooter"></section>

      </div>

    </section>

  </main>

  <!-- CDN 依赖：pdf.js + mammoth.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- 主控逻辑 -->
  <script type="module" src="app.js"></script>

</body>
</html>
