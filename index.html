<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历智能分析</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 页面标题 -->
  <header class="page-header animate-fade-in-up">
    <p class="header-kicker">AI Resume Optimizer</p>
    <h1 class="header-title">简历智能分析</h1>
    <p class="header-subtitle">AI 驱动的简历-JD 匹配分析与优化平台</p>
  </header>

  <!-- 主内容区 -->
  <main class="main-container">

    <!-- 上传区域（分析前显示） -->
    <section class="card upload-card animate-fade-in-up" id="uploadSection" style="animation-delay:.1s">
      <p class="card-kicker">Upload</p>
      <h2 class="card-title">上传简历 & JD</h2>

      <div class="upload-fields">
        <div class="field-group">
          <label class="field-label">简历文件（DOCX / TXT）</label>
          <div class="upload-zone" id="dropZone">
            <input type="file" id="fileInput" accept=".docx,.txt" hidden>
            <p class="upload-hint" id="uploadHint">点击上传 DOCX 或 TXT 文件</p>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">职位描述（JD）</label>
          <div class="jd-input-wrapper">
            <textarea id="jdTextarea" class="glass-textarea" rows="6" placeholder="粘贴目标岗位的 JD 内容...  支持 Ctrl+V 粘贴截图或点击下方上传图片"></textarea>
            <div class="jd-image-bar">
              <label class="jd-upload-btn">
                <input type="file" id="jdImageInput" accept="image/*" hidden>
                上传 JD 截图
              </label>
              <span class="jd-paste-hint" id="jdPasteHint"></span>
            </div>
          </div>
        </div>

        <div class="error-box" id="errorBox" style="display:none"></div>

        <button class="primary-btn" id="generateBtn">开始智能分析</button>
      </div>
    </section>

    <!-- 加载动画 -->
    <div class="loading-container" id="loadingContainer" style="display:none">
      <div class="spinner"></div>
      <p>AI 正在分析匹配…</p>
    </div>

    <!-- ===== 结果区 ===== -->
    <div id="resultArea" style="display:none">

      <!-- 四维匹配标签入口 -->
      <div class="match-tags-bar animate-fade-in-up" id="matchTagsBar"></div>

      <!-- 操作按钮栏 -->
      <div class="result-toolbar" id="resultToolbar" style="display:none">
        <button class="primary-btn" id="downloadDocxBtn" style="display:none">下载优化简历 (.docx)</button>
      </div>

      <!-- 模块 1: 简历诊断报告 -->
      <section class="card stagger-card" id="cardDiagnostic">
        <p class="card-kicker">Diagnostic Report</p>
        <h2 class="card-title">简历诊断报告</h2>
        <div class="diagnostic-body" id="diagnosticBody"></div>
      </section>

      <!-- 模块 2: 匹配点与风险差距分析 -->
      <section class="card stagger-card" id="cardMatch">
        <p class="card-kicker">Match Analysis</p>
        <h2 class="card-title">匹配点与风险差距分析</h2>
        <div class="match-grid" id="matchGrid"></div>
      </section>

      <!-- 模块 3: 岗位定制版经历展示 -->
      <section class="card stagger-card" id="cardExperience">
        <p class="card-kicker">Experience</p>
        <h2 class="card-title">岗位定制版经历展示</h2>
        <div id="experienceList"></div>
      </section>

      <!-- 模块 4: 面试亮点与建议补充 -->
      <section class="card stagger-card" id="cardInterview">
        <p class="card-kicker">Interview Tips</p>
        <h2 class="card-title">面试亮点与建议补充</h2>
        <div id="interviewBody"></div>
      </section>

      <!-- 模块 5: 面试自我介绍 -->
      <section class="card stagger-card" id="cardIntro">
        <p class="card-kicker">Self Introduction</p>
        <h2 class="card-title">面试自我介绍</h2>
        <div id="introBody"></div>
      </section>

      <!-- 模块 6: HR 打招呼信息 -->
      <section class="card stagger-card" id="cardGreeting">
        <p class="card-kicker">HR Greeting</p>
        <h2 class="card-title">HR 打招呼信息</h2>
        <div id="greetingBody"></div>
      </section>

    </div>

  </main>

  <!-- 四维匹配弹窗 -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" style="display:none"></div>

  <!-- CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
